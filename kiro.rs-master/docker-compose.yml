services:
  kiro-rs:
    image: ${KIRO_RS_IMAGE:-zyphrzero/kiro-rs:latest}
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8990:8990"
    volumes:
      - ./data/:/app/config/
    restart: unless-stopped
    networks:
      - default
      - sub2api-network

networks:
  sub2api-network:
    external: true
    name: deploy_sub2api-network
